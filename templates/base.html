<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailPro - Campaign Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <span>📧 EmailPro</span>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}" class="nav-item">Dashboard</a>
            <a href="{{ url_for('classify') }}" class="nav-item">Audience</a>
            <a href="{{ url_for('send') }}" class="nav-item">Campaign</a>
            <a href="{{ url_for('report') }}" class="nav-item">Reports</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="alerts">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
